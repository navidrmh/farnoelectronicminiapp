<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914"><title>FarnoSelf • F Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span> FARNO<span>SELF</span></div>
  <div class="level-pill">LVL <b id="level">1</b></div>
</header>

<main>
<section class="hero">
  <div class="eyebrow">F COIN BALANCE</div>
  <div class="balance" id="balance">0</div>
  <div class="rank" id="rank">STARTER</div>
</section>

<section class="coin-stage">
  <div class="orbit orbit1"></div><div class="orbit orbit2"></div><div class="orbit orbit3"></div>
  <div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div>
  <button class="coin" id="coin" aria-label="Tap F Coin">
    <div class="coin-inner">
      <div class="f-symbol"><span>F</span></div>
      <div class="coin-label">F COIN</div>
    </div>
  </button>
  <div id="popups"></div>
</section>

<section class="stats">
  <div class="stat"><span>⚡ ENERGY</span><b><i id="energy">100</i>/100</b></div>
  <div class="stat"><span>🔥 TAP POWER</span><b>+<i id="tapPower">1</i></b></div>
</section>
<div class="progress"><div id="energyBar"></div></div>

<section class="level-card">
  <div class="level-top"><div><small>F COIN LEVEL</small><strong id="levelName">STARTER</strong></div><b><span id="xp">0</span> / <span id="xpNext">1,000</span> XP</b></div>
  <div class="xpbar"><div id="xpBar"></div></div>
  <div class="level-foot"><span>Next: <b id="nextName">RISING</b></span><span>+1 tap power</span></div>
</section>

<section class="actions">
  <button class="action" id="convert"><span>⇄</span><b>Convert</b><small>1,000 F → 1 Bot Coin</small></button>
  <button class="action" id="bonus"><span>🎁</span><b>Daily Bonus</b><small>Claim once per day</small></button>
</section>
</main>

<nav class="nav">
<button class="nav-item active">◉<small>Earn</small></button>
<button class="nav-item">🎯<small>Tasks</small></button>
<button class="nav-item">👥<small>Friends</small></button>
<button class="nav-item">🏆<small>Ranks</small></button>
</nav>
<div id="toast" class="toast"></div>
</div>
<script src="app.js"></script>
</body></html>
